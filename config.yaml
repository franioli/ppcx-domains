# Data selection parameters
data:
  year: null # Year of interest. Can be overwritten by the --date argument in the command line
  reference_date: null # Date to process (e.g., "2017-06-15"). It can be ovewritten by the --date in the command-line

  # Data Source Configuration
  source: "file" # "database" or "file"
  file_path: null    # Path to input file (e.g. NetCDF) if source is "file"
  search_dir: "/mnt/irpinas/planpincieux/ppcx_dic/data/${data.year}/correlation/day_dic_ensemble_netcdf/" # Directory to search for input files if source is "file". Can use glob patterns (e.g., "data/2017/*.nc") to specify multiple files.
  search_pattern: 'day_dic_(?P<slave>\d{4}-\d{2}-\d{2})_(?P<master>\d{4}-\d{2}-\d{2})_dt(?P<dt>\d+)_.*\.nc' # Regular expression pattern to extract slave date, master date, and time difference  from filenames when source is "file". The pattern should include named groups for the relevant metadata. For example:
  #   'day_dic_(?P<slave>\d{4}-\d{2}-\d{2})_(?P<master>\d{4}-\d{2}-\d{2})_dt(?P<dt>\d+)_.*\.nc'
  #   This pattern match filename like:
  #   "day_dic_2025-01-08_2025-01-01_dt7_ensemble2.nc".
  image_dir: "/mnt/irpinas/planpincieux/ppcx_dic/data/${data.year}/coregistration/coregistered/"

  # Database query parameters. Used only if source is "database"
  camera_name: "PPCX_Tele" # Name of the camera ("PPCX_Tele", "PPCX_Wide").
  days_before_to_include: 0 # Number of days before the reference date to include in the analysis. 
  days_after_to_include: 0 # Number of days after the reference date to include in the analysis.

  dt_min: 24  # Minimum time difference between images in hours. Used both for files and database sources. 70
  dt_max: 120  # Maximum time difference between images in hours. Used both for files and database sources. 100

  # Priors and ROI
  sector_prior_path: "data/${data.year}*.zip" # Path to CVAT ZIP file containing sector prior polygons (and optionally ROI polygon)
  # roi_path: "data/roi.xml" # Path to CVAT XML file containing ROI polygon (optional, if not already included in sector_prior_path)

  output_dir: "output/${data.year}_${data.camera_name}" # Output directory for results


# Data preprocessing parameters
preprocessing:
  variables_names: ["V"] # The feature vector used for clustering (Velocity)
  feature_weights: null  # e.g., [1.0] # Weights for each feature in variables_names. Used only if multiple features are used.
  velocity_transform: null  # # Use if velocity distribution is heavily skewed (non-Gaussian) ["power" | "exponential" | "sigmoid" | null]
  transform_params: null # e.g., {"midpoint_percentile": 70, "steepness": 2.0}
  subsample_factor: 1 # 2 means keep every 2nd point, 1 means no subsampling
  subsample_method: "regular"  # or 'random'
  filter_kwargs:
    min_velocity: 0.5  # Minimum velocity threshold (units depend on input data)
    filter_outliers: false
    tails_percentile: 0.005
    apply_2d_median: false
    median_window_size: 5
    median_threshold_factor: 3
    apply_2d_gaussian: false
    gaussian_sigma: 1.0
    apply_lamma_filter: true
    lamma_method: "Neighbours"
    lamma_k: 8

# MCMC parameters
mcmc:
  priors:  # Prior probability for each sector
    probability:
      A: [1.0, 0.0, 0.0, 0.0]
      B: [0.1, 0.7, 0.2, 0.0]
      C: [0.0, 0.2, 0.8, 0.0]
      D: [0.0, 0.0, 0.3, 0.7]
    fade_method: "exponential"  # "constant" | "idw" | "linear" | "exponential"
    fade_options: # The options are passed to the selected method. Check the mcmc.assign_spatial_priors() function for details.
      decay_rate: 0.001 # Higher values lead to faster decay
  sample_options:
    target_accept: 0.90 # Higher (0.9+) reduces divergent transitions but slows sampling
    draws: 2000 # Increase (>2000) if posterior distributions are rough/unconverged
    tune: 1000 # Number of tuning steps (discarded samples)
    chains: 4 # Number of parallel chains. With fewer chains, increase draws to compensate.
    cores: 4  # Number of CPU cores to use for parallel sampling (usually set to number of chains)
  force_cpu: false # Whether to force CPU sampling even if GPU is available (default: false, use GPU if available)
  model_options:
    mu_params:
      mu: 0
      sigma: 1
    sigma_params:
      sigma: 1

  # --- Markov Random Field (MRF) Regularization ---
  # Balances spatial smoothing (neighbors) against data fidelity (velocity/location).
  mrf_regularization: true
  mrf_kwargs:
    # Graph Density: Controls connectivity.
    # - High (16+): Smoother results, effective for sparse/noisy data.
    # - Low (4-6): Local influence only, better for small sharp features.
    n_neighbors: 16

    # Spatial Decay: How influence drops with physical distance.
    # - Increase: Distant neighbors bridge gaps (good for sparse data).
    # - Decrease: Only immediate vicinity exerts influence.
    length_scale: 200

    # Interaction Strength (The Main Knob):
    # - High (3.0 - 5.0) -> Prioritize Smoothing. 
    #   Forces points to match neighbors. Removes "salt-and-pepper" noise, cleaner chunks.
    # - Low (0.5 - 1.0) -> Prioritize Fidelity.
    #   Respects raw velocity/location data. Preserves sharp transitions but leaves noise.
    beta: 3

    # Number of Iterations for MRF prior weight updates:
    # - Low (5-10): Local smoothing, preserves small features.
    # - High (>20): Global info propagation, very smooth results.
    n_iter: 10

  # Second pass sampling speed choices:
  # - "short": short sampling + warm-start (recommended default):
  # - "skip": fastest, rely only on MRF priors, no re-sampling
  second_pass: "short"  # "skip" | "short" | "full"
  second_pass_sample_args:
    draws: 1000
    tune: 200
    chains: 4
    cores: 4
    target_accept: 0.9

# Multi-scale processing parameters
multiscale:
  sigma_values: null # [0] # List of Gaussian sigma values for multi-scale processing (0 means no smoothing)
  aggregation:
    similarity_threshold: 0.7
    overall_threshold: 0.8

# Post-processing parameters
postprocessing:
  vectorization:
    min_area_px2: 100000.0
    isolation_buffer: 30.0
    velocity_merge_threshold: 1
    force_minimum_sectors: true
    target_number_of_sectors: 4
    fill_holes_area: 80000.0
    smooth_geometries: true
    smooth_method: "smoothify"
    smooth_iterations: 1
  sector_assignment:
    method: "y_centroid"  # Sorts resulting clusters by elevation to ensure consistent labeling (A, B, C...)
    ascending: false      # False if sector A is at the bottom (lowest Y), True otherwise (the y axis is inverted in image coordinates (0 at top))
    # sector_colors:
    #   A: "#b3140b"      # Red
    #   B: "#ee9c21"      # Orange
    #   C: "#f1ee30"      # Yellow
    #   D: "#5fb61c"      # Green

plotting:
  default_discrete_cmap: "tab10"  # Colormap for discrete sector colors when not specified
  default_continuous_cmap: "OrRd"  # Colormap for continuous data plotting (e.g., velocity)
  quiver:
    cmap: "OrRd"
    vmin: 0
    vmax: 15

anomaly_detection:
  run_anomaly_detection: true
  target_sector: "A" # Sector to analyze for anomalies (e.g., "A")
  prior_percentile_threshold: 98 # Percentile threshold for velocity-based priors (e.g., 90 means points above the 90th percentile of velocity are more likely to be anomalies)
  variables_names: ["V", "u"] # The feature vector used for clustering (Velocity)
  model_options:
    mu_params:
      mu: 0
      sigma: 10
    sigma_params:
      sigma: 0.5
  sample_options:
    target_accept: 0.95
    draws: 4000
    tune: 2000
  mrf_options: # MRF settings specific for anomaly detection (can be more aggressive to capture small anomalous features)
    n_neighbors: 12
    length_scale: 50
    beta: 4.0
    n_iter: 20

