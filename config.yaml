# Data selection parameters
data:
  output_dir: "output"
  reference_date: "2021-08-15"
  camera_name: "PPCX_Tele"
  days_before_to_include: 0
  days_after_to_include: 0
  dt_min: 70  # Minimum time difference between images in hours
  dt_max: 100  # Maximum time difference between images in hours
  roi_path: "data/roi.xml"
  sector_prior_file: "data/prior_data/2020_4domains_job_24_2025_11_27_13_43_22.zip"
  variables_names: ["V"] # List of variable names to process

# Data preprocessing parameters
preprocessing:
  subsample_factor: 1 # 2 means keep every 2nd point, 1 means no subsampling
  subsample_method: "regular"  # or 'random'
  filter_kwargs:
    min_velocity: 0.5
    filter_outliers: false
    tails_percentile: 0.005
    apply_2d_median: false
    median_window_size: 5
    median_threshold_factor: 3
    apply_2d_gaussian: false
    gaussian_sigma: 1.0

# Prior probability for each sector
priors: 
  probability:
    A: [1.0, 0.0, 0.0, 0.0]
    B: [0.1, 0.7, 0.2, 0.0]
    C: [0.0, 0.2, 0.8, 0.0]
    D: [0.0, 0.0, 0.3, 0.7]
  fade_method: "exponential"  # "constant" | "idw" | "linear" | "exponential"
  fade_options: 
    idw:
      power: 2
    linear:
      max_distance: 100
    exponential:
      "decay_rate": 0.001

# MCMC parameters
mcmc:
  sample_options:
    target_accept: 0.9
    draws: 2000
    tune: 1000
    chains: 4
    cores: 4
  model_options:
    mu_params:
      mu: 0
      sigma: 1
    sigma_params:
      sigma: 1
  velocity_transform: null  # "power" | "exponential" | "sigmoid" | null
  transform_params: {} # e.g., {"midpoint_percentile": 70, "steepness": 2.0}
  mrf_regularization: true
  mrf_kwargs:
    n_neighbors: 8
    length_scale: 50
    beta: 2.0
    n_iter: 5
  # Second pass speed choices:
    # 1) "short": short sampling + warm-start (recommended default):
    # 2) "skip": fastest, rely only on MRF priors, no re-sampling
  second_pass: "short"  # "skip" | "short" | "full"
  second_pass_sample_args:
    draws: 500
    tune: 300
    chains: 4
    cores: 4
    target_accept: 0.9

# Multi-scale processing parameters
multiscale:
  sigma_values: [0] # List of Gaussian sigma values for multi-scale processing (0 means no smoothing)
  aggregation:
    similarity_threshold: 0.7
    overall_threshold: 0.8

# Post-processing parameters
postprocessing:
  erosion_iterations: 0      # Number of erosion iterations to disconnect narrow bridges
  dilation_iterations: 0     # Number of dilation iterations to restore cluster size
  split_disconnected_components: true
  min_cluster_size: -1      # Minimum number of pixels for a cluster to survive
  # min_cluster_size_px: 100  # Minimum cluster size for second pass processing
  connectivity: 8           # 4 or 8 connectivity for component analysis (for all postproc steps)
  keep_only_largest_n: -1    # Keep only the largest N clusters, -1 to keep all
  vectorization:
    method: "smoothify"  # "convex_hull" | "cell_union" | "alphashape" | "smoothify"
    buffer_distance: 2.0
    simplify_tolerance: 0.0
  sector_assignment:
    # method: "centroid"  # "centroid" | "max_overlap"
    sector_colors:
      A: "#b3140b"
      B: "#ee9c21"
      C: "#f1ee30"
      D: "#5fb61c"

# Morpho-kinematic analysis parameters
morphokinematic:
  minor_overlap_threshold: 0.9
  sector_colors:
    A: "#b3140b"
    B: "#ee9c21"
    C: "#f1ee30"
    D: "#5fb61c"

# Random seed for reproducibility
random_seed: 8927

# Database configuration
database:
  host: 150.145.51.193
  port: 5434
  name: planpincieux
  user: postgres

# API configuration
api:
  host: "150.145.51.193"
  port: 8080
  image_view: "images"

