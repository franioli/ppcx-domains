name: Create TODO Issues

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not actually create issues)'
        required: false
        default: 'false'
        type: boolean

permissions:
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Create TODO issues from code comments
        uses: actions/github-script@v7
        with:
          script: |
            const dryRun = context.payload.inputs?.dry_run === 'true';
            if (dryRun) {
              console.log('DRY RUN: Issues will not be created');
            }

            const issues = [
              {
                title: 'Replace hardcoded date exclusion with systematic metadata-based approach',
                body: `## Description

In \`analyze_sectors_ts.py\` (line 30), there is a hardcoded list of dates to exclude from analysis. This approach is fragile and hard to maintain.

## Current Code

\`\`\`python
# TODO: this should be replaced by a more systematic approach
# (e.g. a metadata file with flags for each date)
\`\`\`

## Proposed Solution

Implement a metadata file (e.g. YAML or CSV) with per-date flags that allow marking dates to be excluded from time-series analysis. The code should then read this metadata file instead of relying on hardcoded values.

## References

- File: \`analyze_sectors_ts.py\`, line 30`,
                labels: ['enhancement', 'technical-debt']
              },
              {
                title: 'Remove or reintroduce deprecated multi-scale clustering section in config',
                body: `## Description

The \`config.yaml\` file (around line 152) contains a section marked as **DEPRECATED** that is currently not used. It was designed for multi-scale clustering approaches.

## Current Situation

\`\`\`yaml
# DEPRECATED: This section is currently not used, but it can be reintroduced
# in the future for multi-scale clustering approaches.
\`\`\`

## Action Required

Either:
1. Remove the deprecated section and clean up the configuration file, or
2. Design and implement the multi-scale clustering feature properly

## References

- File: \`config.yaml\`, line ~152`,
                labels: ['enhancement', 'technical-debt']
              },
              {
                title: 'Replace hardcoded feature names (V, V_trans) with fully parameterized config',
                body: `## Description

The feature names \`V\` and \`V_trans\` (velocity direction/transverse components) are hardcoded in the code instead of being fully driven by configuration.

## Current Situation

In \`config.yaml\` (line ~192) and \`config_anomaly.yaml\` (line ~62):
\`\`\`yaml
# variables_names: ["V", "u"] # TODO: This is hardcoded in the code, now we are using V and V_trans (direction)
\`\`\`

## Proposed Solution

Parameterize the feature column names in the configuration so that the code reads the column names from config instead of having them hardcoded. This will improve flexibility and maintainability.

## References

- File: \`config.yaml\`, line ~192
- File: \`config_anomaly.yaml\`, line ~62
- File: \`ppcx_detect_anomaly.py\`, line 179 (related: experiment with adding "V_trans")`,
                labels: ['enhancement', 'technical-debt']
              },
              {
                title: 'Experiment with adding V_trans as feature in anomaly detection',
                body: `## Description

The anomaly detection currently uses only the \`V\` feature (velocity magnitude). There is an open TODO to experiment with also incorporating \`V_trans\` (transverse velocity component).

## Current Code

In \`ppcx_detect_anomaly.py\` (line 179):
\`\`\`python
refine_features = ["V"]  # TODO: We can experiment with adding "V_trans"
\`\`\`

## Proposed Work

1. Add \`V_trans\` as an optional feature in anomaly detection
2. Evaluate its impact on detection accuracy and false positive rate
3. Consider making the feature list configurable

## References

- File: \`ppcx_detect_anomaly.py\`, line 179
- Related: Replace hardcoded feature names (V, V_trans) with fully parameterized config`,
                labels: ['enhancement', 'research']
              },
              {
                title: 'Refactor anomaly detection to use refactored helper function',
                body: `## Description

In \`ppcx_detect_anomaly.py\` (line 816), there is duplicated code that should be replaced with a call to an already-refactored function.

## Current Code

\`\`\`python
# TODO: Use the refractored function instead of this code here.
\`\`\`

## Action Required

Replace the inline code block at line 816 in \`ppcx_detect_anomaly.py\` with the appropriate refactored function call. This will reduce code duplication and improve maintainability.

## References

- File: \`ppcx_detect_anomaly.py\`, line 816`,
                labels: ['refactoring', 'technical-debt']
              },
              {
                title: 'Move spatial prior preprocessing steps into dedicated function',
                body: `## Description

In \`ppcx_identify_domains.py\` (line 233), there is a TODO to move spatial prior preprocessing steps from the main function into a dedicated helper function.

## Current Code

\`\`\`python
# TODO: move here other spatial prior preprocessing steps now in the main function
\`\`\`

## Proposed Solution

Refactor the preprocessing steps for spatial priors out of the main function and into the existing or a new dedicated helper function. This improves readability, testability, and separation of concerns.

## References

- File: \`ppcx_identify_domains.py\`, line 233`,
                labels: ['refactoring', 'technical-debt']
              },
              {
                title: 'Move plotting logic into save_sampling_summary function',
                body: `## Description

In \`ppcx_identify_domains.py\` (line 280), plotting/visualization logic is scattered in the main function instead of being encapsulated in the \`save_sampling_summary\` function where it logically belongs.

## Current Code

\`\`\`python
