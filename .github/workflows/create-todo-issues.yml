Move all plotting logic at line 280 into the \`save_sampling_summary\` function, making the main function cleaner and more focused on orchestration rather than visualization details.

## References

- File: \`ppcx_identify_domains.py\`, line 280`,
                labels: ['refactoring', 'technical-debt']
              },
              {
                title: 'Improve DETECT REFINEMENT OVERRIDE logic in domain identification',
                body: `## Description

In \`ppcx_identify_domains.py\` (line 682), the DETECT REFINEMENT OVERRIDE logic is handled in a way that is difficult to maintain and understand.

