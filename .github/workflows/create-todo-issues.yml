## Proposed Solution

Refactor the refinement override logic into a cleaner design. Consider:
1. Using a dedicated configuration parameter or flag
2. Creating a helper function that encapsulates the override logic
3. Documenting the intended behavior more clearly

## References

- File: \`ppcx_identify_domains.py\`, line 682`,
                labels: ['refactoring', 'technical-debt']
              },
              {
                title: 'Implement velocity-based priors without spatial sector requirement',
                body: `## Description

Currently, the system requires spatial priors (sectors) whenever any priors are specified. There is an open TODO to implement support for velocity-based priors that don't require spatial sectors.

## Current Code

In \`ppcx_identify_domains.py\` (line 698):
\`\`\`python
