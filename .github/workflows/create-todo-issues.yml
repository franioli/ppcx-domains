# (e.g. velocity-based) without spatial sectors, but for now we require
# spatial priors if any priors are specified.
\`\`\`

## Proposed Solution

1. Add a new prior type \`velocity\` (or similar) to the configuration schema
2. Implement the velocity-based prior computation
3. Update the validation logic to allow priors without spatial sectors when using velocity-based priors

## References

- File: \`ppcx_identify_domains.py\`, line 698`,
                labels: ['enhancement', 'feature-request']
              },
              {
                title: 'Review placement of MAD filtering parameters in configuration dataclasses',
                body: `## Description

In \`src/ppcluster/config.py\` (line 104), there is a question about whether certain parameters (related to MAD filtering) belong in \`DataConfig\` or their current location.

## Current Code

\`\`\`python
# Mad filtering parameters (applicable to both sources)
# TODO: Check position of these params, maybe in DataConfig?
\`\`\`

## Action Required

Review the placement of these configuration parameters and determine the most logical and consistent place for them in the configuration dataclass hierarchy. Move them if needed and update all references accordingly.

## References

- File: \`src/ppcluster/config.py\`, line 104`,
                labels: ['refactoring', 'technical-debt']
              },
            ];

            // Check existing issues to avoid duplicates
            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const existingTitles = new Set(existingIssues.map(i => i.title));

            let created = 0;
            let skipped = 0;

            for (const issue of issues) {
              if (existingTitles.has(issue.title)) {
                console.log(`Skipping (already exists): ${issue.title}`);
                skipped++;
                continue;
              }

              if (dryRun) {
                console.log(`[DRY RUN] Would create: ${issue.title}`);
                continue;
              }

              try {
                const result = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issue.title,
                  body: issue.body,
                  labels: issue.labels
                });
                console.log(`Created issue #${result.data.number}: ${issue.title}`);
                created++;
              } catch (error) {
                // If label creation fails, try without labels
                if (error.status === 422) {
                  const result = await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: issue.title,
                    body: issue.body
                  });
                  console.log(`Created issue #${result.data.number} (without labels): ${issue.title}`);
                  created++;
                } else {
                  core.warning(`Failed to create issue "${issue.title}": ${error.message}`);
                }
              }
            }

            console.log(`\nSummary: Created ${created}, Skipped ${skipped} (already exist)`);
